[build]
  command = "npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/out"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Disable Netlify feedback drawer / badge widget
[context.deploy-preview]
  drawer = false

[context.branch-deploy]
  drawer = false

[context.production]
  drawer = false

